name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_dummy
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          GEMINI_API_KEY: dummy
          AZURE_OPENAI_API_KEY: dummy
          AZURE_OPENAI_API_VERSION: dummy
          AZURE_OPENAI_DEPLOYMENT_NAME: dummy
          AZURE_OPENAI_ENDPOINT: https://example.invalid
          AZURE_STORAGE_CONNECTION_STRING: dummy
          AZURE_STORAGE_CONTAINER_NAME: dummy
          AZURE_STORAGE_PUBLIC_BASE_URL: https://example.invalid
          FONADALAB_API_KEY: dummy
          NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /sign-up
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
          REPLICATE_API_KEY: dummy
